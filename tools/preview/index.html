<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>call-whisper — podgląd popupu</title>
    <link rel="stylesheet" href="/extension/popup/heroui.css" />
    <link rel="stylesheet" href="/extension/popup/popup.css" />
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body class="preview-body">
